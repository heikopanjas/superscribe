name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.binary.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Test and enforce 100 percent coverage
        run: _scripts/coverage.sh --run-tests
      - uses: ./.github/actions/build-release
        id: binary
      - name: Sign and notarize main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BINARY_PATH: ${{ steps.binary.outputs.path }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_P8_BASE64 }}
        run: bash _scripts/sign-release.sh "$BINARY_PATH"
      - name: Smoke test and package release
        env:
          BINARY_PATH: ${{ steps.binary.outputs.path }}
          VERSION: ${{ steps.binary.outputs.version }}
        run: |
          "$BINARY_PATH" --version
          "$BINARY_PATH" --help
          bash _scripts/package-release.sh "$VERSION" "$BINARY_PATH" "$RUNNER_TEMP/dist"
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: superscribe-macos-arm64${{ github.event_name == 'pull_request' && '-unsigned' || '' }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: superscribe-macos-arm64
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: bash _scripts/publish-release.sh "$VERSION" dist
